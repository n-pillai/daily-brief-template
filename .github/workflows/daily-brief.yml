name: Daily Brief

on:
  # ── SCHEDULED RUNS ARE DISABLED BY DEFAULT ──
  # To go live, uncomment the schedule block below. The workflow then runs
  # every hour; the Python script checks your calendar (CALENDAR_ICS_URL) for
  # travel events and only generates the brief at your configured local hour,
  # wherever you are. No changes needed when traveling — update your calendar
  # and it adjusts.
  #
  # schedule:
  #   - cron: "0 * * * *"

  # Allow manual trigger from GitHub UI (useful for re-runs or off-schedule delivery)
  workflow_dispatch:
    inputs:
      force:
        description: "Skip scheduling guard and generate immediately (for testing)"
        required: false
        default: "false"
      dry_run:
        description: "Dry run: full generation but no email, no audio, no commits — output uploaded as an artifact"
        required: false
        default: "false"
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Skip if brief already generated today
        id: check_existing
        run: |
          DATE=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run — always generating."
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ -f "briefs/daily_brief_${DATE}.html" ]; then
            echo "Brief already exists for ${DATE} — skipping run."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check_existing.outputs.skip == 'false'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.check_existing.outputs.skip == 'false'
        run: pip install -r requirements.txt

      - name: Generate daily brief
        if: steps.check_existing.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          WEATHER_LOCATION_HOME: ${{ secrets.WEATHER_LOCATION_HOME }}
          WEATHER_LOCATION_WORK: ${{ secrets.WEATHER_LOCATION_WORK }}
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          FORCE_GENERATE: ${{ github.event.inputs.force }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python generate_brief.py

      - name: Upload dry-run output as artifact
        if: steps.check_existing.outputs.skip == 'false' && github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-brief
          path: briefs/dryrun_*
          retention-days: 7

      # Keeps only the last RETENTION_DAYS days of .mp3/.html briefs. Pruned here,
      # before staging, so additions and deletions land in one commit.
      - name: Prune briefs older than the retention window
        if: steps.check_existing.outputs.skip == 'false' && github.event.inputs.dry_run != 'true'
        env:
          RETENTION_DAYS: "7"
        run: |
          python - <<'PY'
          import datetime, os
          from pathlib import Path

          days = int(os.environ["RETENTION_DAYS"])
          cutoff = datetime.date.today() - datetime.timedelta(days=days)
          removed = []
          for f in sorted(Path("briefs").glob("daily_brief_*")):
              if f.suffix not in (".mp3", ".html"):
                  continue
              try:
                  stamp = datetime.date.fromisoformat(f.stem[len("daily_brief_"):])
              except ValueError:
                  continue  # not a dated brief; leave it alone
              if stamp < cutoff:
                  f.unlink()
                  removed.append(f.name)
          print(f"Pruned {len(removed)} file(s) older than {cutoff}: {removed}" if removed
                else f"Nothing older than {cutoff} to prune")
          PY

      - name: Commit briefs
        if: steps.check_existing.outputs.skip == 'false' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "Daily Brief Bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          # -A so the prune step's deletions are staged alongside today's additions.
          # deep_dive_state.json is deliberately absent -- it's user-specific
          # reading/listening data, not meant for this public template.
          git add -A briefs/
          # data/ isn't tracked in a fresh fork, and `git add <missing path>` is a
          # hard error -- would fail the run after the brief already sent. The
          # generator creates data/, so this only matters if generation was skipped.
          if [ -d data ]; then
            git add -A data/
          fi
          if git diff --cached --quiet; then
            echo "No new briefs to commit"
          else
            git commit -m "feat: add daily brief $(date +%Y-%m-%d)"
            git push
          fi
