name: tests

# test_quality.py and test_regressions.py: pure and offline, no API keys or
# network, so safe on PRs from forks too. test_schedule.py is excluded here --
# it needs CALENDAR_ICS_URL and network access, so it stays a manual dispatch
# in test-schedule.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Quality layer (prose lint, word budget, coverage log)
        run: python test_quality.py

      - name: Regression detection (section bleed, cross-section dedup)
        run: python test_regressions.py
